name: Continuous Integration

on:
  push:
    branches: [ "MZ-Main", "main" ]
  pull_request:
    branches: [ "MZ-Main", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/vto_test?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_SECRET: "ci-environment-test-auth-secret-string-32-chars"
      NODE_ENV: "test"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Execute Vitest Suite
        run: npm test

      - name: Build Next.js Production Assets
        env:
          NODE_ENV: production
        run: npm run build
